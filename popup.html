<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 240px;
        padding: 16px;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #171717;
        color: #e8e8e8;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 700;
      }
      h1 span {
        color: #1dbf73;
      }
      p {
        margin: 0 0 16px;
        color: #a0a3a8;
        font-size: 12px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
      }
      input {
        appearance: none;
        position: relative;
        width: 40px;
        height: 22px;
        margin: 0;
        border-radius: 11px;
        background: #3a3b3f;
        cursor: pointer;
        transition: background 0.15s;
      }
      input::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      input:checked {
        background: #1dbf73;
      }
      input:checked::after {
        transform: translateX(18px);
      }
    </style>
  </head>
  <body>
    <h1>fiverr<span>.</span> Dark Mode</h1>
    <p>Dark theme for fiverr.com</p>
    <label>
      Enabled
      <input type="checkbox" id="enabled" />
    </label>
    <script src="popup.js"></script>
  </body>
</html>
